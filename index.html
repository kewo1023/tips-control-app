<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tips Control</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tips">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#123c26">

<script>
/* Este trocito va en la cabecera a propósito, antes de que se dibuje nada.
   Si el tema se aplicara al final, la app abriría un instante en claro y
   saltaría a oscuro: ese parpadeo blanco a la salida de un turno de noche es
   exactamente lo que no queremos. Está duplicado (la función completa vive
   abajo) porque aquí solo puede correr lo mínimo. */
(function () {
  try {
    const guardado = JSON.parse(localStorage.getItem('tipsControl') || '{}');
    const elegido = (guardado.prefs && guardado.prefs.tema) || 'auto';
    const oscuro = elegido === 'oscuro' || (elegido === 'auto' &&
      window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
  } catch (e) {
    document.documentElement.dataset.tema = 'claro';
  }
})();
</script>

<style>
/* ============================================================================
   SECCIÓN A — Colores
   ----------------------------------------------------------------------------
   Decisión de diseño (v2): el color ya NO rellena tarjetas. El verde aparece
   en tres sitios y en ninguno más: la cifra principal, la barra de cada día y
   la pestaña activa. Todo lo demás es papel y tinta.

   La razón: cuando todo está resaltado, nada está resaltado. Antes el bloque
   verde competía con el número que de verdad importaba.
   ========================================================================== */
:root {
  --papel:      #faf9f7;   /* el fondo */
  --tarjeta:    #ffffff;
  --linea:      #e7e5e0;   /* bordes: casi invisibles, solo separan */
  --linea-alta: #c8c5be;
  --tinta:      #16150f;   /* el texto principal */
  --tinta-2:    #6b6963;   /* etiquetas y datos secundarios */
  --tinta-3:    #9a9891;   /* lo que casi no importa */
  --verde:      #15803d;
  --verde-suave:#dcf2e3;   /* solo para las barras de los días */
  --rojo:       #a52020;
}
/* El modo oscuro ya NO se activa con `prefers-color-scheme` desde el CSS, sino
   con el atributo `data-tema` en la etiqueta <html>. Quien decide el valor de
   ese atributo es la función `aplicarTema()`: si el usuario eligió Automático,
   consulta al sistema; si eligió claro u oscuro, manda su elección.

   Lo importante es que aquí solo hay dos juegos de colores, uno claro y uno
   oscuro. La tercera opción (Automático) no necesita colores propios: se
   resuelve a uno de los dos antes de que la página se dibuje. */
:root[data-tema="oscuro"] {
    --papel:      #0e0e0d;
    --tarjeta:    #191918;
    --linea:      #2b2b28;
    --linea-alta: #45443f;
    --tinta:      #f7f6f3;
    --tinta-2:    #9d9b94;
    --tinta-3:    #6a6862;
    --verde:      #5bd68b;
    --verde-suave:#1a3226;
    --rojo:       #f08c8c;
}

/* ============================================================================
   SECCIÓN B — Base y tipografía
   ----------------------------------------------------------------------------
   El carácter de la app está aquí, no en el color. Dos recursos:

   1. Contraste de tamaño brutal entre la cifra y su etiqueta (40px contra
      10px). Una jerarquía tímida se lee como desorden.
   2. Etiquetas en versalitas espaciadas. Es un recurso de tipografía editorial
      (periódicos, informes financieros) y hace que un dato se lea como un dato
      y no como una frase.
   ========================================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  padding: 0 14px calc(76px + env(safe-area-inset-bottom));
  background: var(--papel);
  color: var(--tinta);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}

/* Versalitas: la etiqueta de todo dato numérico */
.etiqueta {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--tinta-3);
}

/* Las cifras van en fuente tabular para que se alineen en columna, y con las
   letras un poco apretadas: un número grande con espaciado normal se ve
   desparramado. */
.cifra { font-variant-numeric: tabular-nums; letter-spacing: -0.025em; }

.tarjeta {
  background: var(--tarjeta);
  border: 1px solid var(--linea);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
}

/* ============================================================================
   SECCIÓN C — Cabecera y navegación entre semanas
   ========================================================================== */
.cabecera {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 2px 12px;
}
.cabecera .lugar { font-size: 13px; color: var(--tinta-2); }
.cabecera .hoy {
  font-size: 12px; color: var(--verde); font-weight: 600;
  padding: 5px 10px; border: 1px solid var(--linea); border-radius: 999px;
  background: none; cursor: pointer;
}

.semana-nav {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.semana-nav .rango { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.semana-nav button {
  width: 40px; height: 40px; border: 1px solid var(--linea);
  background: var(--tarjeta); color: var(--tinta-2); border-radius: 10px;
  font-size: 17px; line-height: 1; cursor: pointer;
}
.semana-nav button:disabled { opacity: .35; }

/* ============================================================================
   SECCIÓN D — La semana: siete días tocables
   ----------------------------------------------------------------------------
   Cada día es un botón. El relleno verde de abajo es proporcional al día que
   más ganaste esa semana: la celda ES la barra. Así se compara de un vistazo
   sin ocupar espacio extra con un gráfico aparte.
   ========================================================================== */
.dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

.dia {
  position: relative; overflow: hidden;
  height: 82px; padding: 7px 2px 6px;
  display: flex; flex-direction: column; align-items: center;
  border: 1px solid var(--linea); border-radius: 9px;
  background: var(--tarjeta); color: var(--tinta);
  font-family: inherit; cursor: pointer;
}
.dia .barra {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--verde-suave);
}
.dia .letra, .dia .num, .dia .monto { position: relative; }
.dia .letra { font-size: 9px; font-weight: 600; letter-spacing: 0.06em;
              color: var(--tinta-3); text-transform: uppercase; }
.dia .num   { font-size: 15px; font-weight: 500; margin-top: 1px; }
.dia .monto { font-size: 11px; font-weight: 600; color: var(--verde);
              margin-top: auto; font-variant-numeric: tabular-nums; }
.dia.vacio .num { color: var(--tinta-3); font-weight: 400; }
.dia.hoy { border-color: var(--tinta); }
.dia.hoy .letra { color: var(--tinta); }

/* ============================================================================
   SECCIÓN E — El resumen de la semana
   ========================================================================== */
.total { padding: 22px 2px 6px; }
.total .cantidad {
  font-size: 42px; font-weight: 600; line-height: 1;
  margin: 6px 0 4px; color: var(--tinta);
}
.total .contra { font-size: 13px; color: var(--tinta-2); }
.total .sube { color: var(--verde); font-weight: 600; }
.total .baja { color: var(--rojo); font-weight: 600; }

/* Rejilla de métricas: las líneas separadoras son el propio hueco de la
   rejilla sobre un fondo del color del borde. Un truco viejo que evita tener
   que decidir qué celda lleva borde y cuál no. */
.metricas {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 1px; background: var(--linea);
  border: 1px solid var(--linea); border-radius: 12px; overflow: hidden;
}
.metricas.extras { grid-template-columns: repeat(3, 1fr); margin-top: 10px; }
.metrica { background: var(--tarjeta); padding: 12px 12px; }
.metrica .valor { font-size: 22px; font-weight: 600; margin-top: 3px;
                  font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.metricas.extras .metrica { padding: 11px 10px; }
.metricas.extras .valor { font-size: 17px; }

/* Cabecera de la tarjeta: la etiqueta y, a la derecha, el botón de ayuda. */
.metrica .cabeza { display: flex; align-items: center;
                   justify-content: space-between; gap: 6px; }

.info {
  flex: none; width: 16px; height: 16px; padding: 0;
  border: 1px solid var(--linea-alta); border-radius: 50%;
  background: none; color: var(--tinta-3);
  font-size: 10px; font-weight: 600; font-style: italic; line-height: 1;
  cursor: pointer;
}

/* La diferencia contra la semana pasada va SIEMPRE en su propio renglón,
   debajo de la cifra. Antes iba al lado y quedaba a merced del ancho: en las
   tarjetas angostas saltaba de línea sola y la rejilla se veía desalineada.
   Una posición fija se lee mejor que una que a veces cambia. */
.delta { display: block; margin-top: 3px;
         font-size: 12.5px; font-weight: 600; letter-spacing: 0; }
.delta.sube   { color: var(--verde); }
.delta.baja   { color: var(--rojo); }
/* Neutro para lo que no tiene "mejor": más horas no es bueno ni malo. */
.delta.plano  { color: var(--tinta-3); }

/* ----------------------------------------------------------------------------
   El globo de ayuda.

   Va con `position: fixed` y se coloca con JavaScript debajo del botón que lo
   abrió. La alternativa —meterlo dentro de la tarjeta— lo habría dejado
   cortado por el `overflow: hidden` que redondea las esquinas de la rejilla, y
   además empujaría el resto de la pantalla hacia abajo al abrirse.

   Colores invertidos (tinta de fondo, papel de letra) para que se lea como
   algo que está *encima* de la app y no como una parte más de ella.
   -------------------------------------------------------------------------- */
.globo {
  position: fixed; z-index: 50;
  width: 235px; max-width: calc(100vw - 28px);
  padding: 10px 12px; border-radius: 10px;
  background: var(--tinta); color: var(--papel);
  font-size: 12.5px; line-height: 1.35;
}

.mas {
  width: 100%; margin-top: 10px; padding: 11px;
  background: none; border: 1px solid var(--linea); border-radius: 10px;
  color: var(--tinta-2); font-size: 13px; cursor: pointer;
}
.dato-suelto { font-size: 13px; color: var(--tinta-2); padding: 12px 2px 0; }

/* ============================================================================
   SECCIÓN F — Formulario del turno
   ========================================================================== */
.barra-titulo {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 0 14px; margin-bottom: 4px;
}
.barra-titulo .fecha { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.barra-titulo button {
  border: none; background: none; color: var(--tinta-2);
  font-size: 15px; cursor: pointer; padding: 6px;
}

.campo { margin-bottom: 13px; }
.campo:last-child { margin-bottom: 0; }
.campo label { display: block; margin-bottom: 5px; }

input[type=text], input[type=number], input[type=time] {
  width: 100%; padding: 11px 12px;
  border: 1px solid var(--linea); border-radius: 9px;
  background: var(--papel); color: var(--tinta);
  /* 16px exactos: con menos, Safari en iPhone hace zoom al tocar el campo. */
  font-size: 16px; font-family: inherit;
  font-variant-numeric: tabular-nums;
}
input:focus { outline: none; border-color: var(--tinta); }
::placeholder { color: var(--tinta-3); }

/* ----------------------------------------------------------------------------
   Las dos cajas de hora, una al lado de la otra.

   Esto costó dos intentos. El control de hora de Safari en iPhone trae un
   ancho propio bastante generoso y se niega a encoger, así que se desbordaba
   de su columna y se montaba sobre la de al lado. Hacen falta las cuatro
   piezas juntas; con menos, en iOS se sigue saliendo:

   1. `minmax(0, 1fr)` en la rejilla. Un `1fr` normal significa en realidad
      "1fr pero nunca menos que el contenido"; el `minmax(0, …)` es lo que le
      quita ese derecho de veto.
   2. `min-width: 0` en la columna, por la misma razón.
   3. `max-width: 100%` en el input: sin él, `width: 100%` no basta en Safari.
   4. `-webkit-appearance: none`: mientras el control conserva su apariencia
      nativa, iOS ignora el ancho que le pidas. El selector de rueda al tocarlo
      sigue funcionando igual; lo único que cambia es el marco.
   -------------------------------------------------------------------------- */
.fila { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.fila > div { min-width: 0; }

input[type=time] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  text-align: center;
}

/* Atajos de hora: las que más usa, sacadas de sus propios turnos. */
.horas { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.horas button {
  padding: 5px 8px; border: 1px solid var(--linea); border-radius: 7px;
  background: none; color: var(--tinta-2); font-size: 12px;
  font-variant-numeric: tabular-nums; cursor: pointer;
}
.horas button.puesta { border-color: var(--verde); color: var(--verde); }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  padding: 8px 13px; border: 1px solid var(--linea); border-radius: 999px;
  background: var(--papel); color: var(--tinta-2);
  font-size: 13px; cursor: pointer; user-select: none;
}
.chip.activo { border-color: var(--verde); color: var(--verde); font-weight: 600; }
.chip small { opacity: .7; margin-left: 3px; }

/* Desglose del cálculo: se lee como un recibo, con la línea de puntos que
   guía el ojo desde el concepto hasta la cifra. */
.recibo { font-size: 14px; }
.recibo div { display: flex; justify-content: space-between; padding: 5px 0;
              color: var(--tinta-2); }
.recibo .final {
  border-top: 1px solid var(--linea); margin-top: 7px; padding-top: 11px;
  color: var(--tinta); font-size: 15px;
}
.recibo .final span:last-child { font-size: 26px; font-weight: 600;
                                 letter-spacing: -0.025em; }
.recibo .resta { color: var(--rojo); }
.recibo span:last-child { font-variant-numeric: tabular-nums; color: var(--tinta); }

/* ============================================================================
   SECCIÓN G — Botones
   ========================================================================== */
button { font-family: inherit; }

.principal {
  width: 100%; padding: 15px; margin-top: 4px;
  background: var(--tinta); color: var(--papel);
  border: none; border-radius: 11px;
  font-size: 16px; font-weight: 600; cursor: pointer;
}
.secundario {
  width: 100%; padding: 12px; margin-top: 8px;
  background: none; color: var(--tinta-2);
  border: 1px solid var(--linea); border-radius: 11px;
  font-size: 14px; cursor: pointer;
}
.secundario.riesgo { color: var(--rojo); }
.chico { padding: 7px 11px; font-size: 13px; border: 1px solid var(--linea);
         border-radius: 8px; background: var(--papel); color: var(--tinta);
         cursor: pointer; }

/* ============================================================================
   SECCIÓN H — Pestañas
   ========================================================================== */
.pestanas {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex;
  background: var(--tarjeta); border-top: 1px solid var(--linea);
  padding-bottom: env(safe-area-inset-bottom); z-index: 10;
}
.pestanas button {
  flex: 1; border: none; background: none; padding: 11px 0 13px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--tinta-3); cursor: pointer;
}
.pestanas button.activa { color: var(--verde); }

.oculto { display: none !important; }
.vacio { text-align: center; color: var(--tinta-3); padding: 30px 20px;
         font-size: 14px; }
/* Control segmentado: tres opciones donde solo una puede estar activa. Se usa
   en vez de un menú desplegable porque las tres caben a la vista: elegir es un
   toque, no dos, y de paso ves qué opciones hay sin tener que abrir nada. */
.segmentado { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
              gap: 6px; }
.segmentado button {
  padding: 11px 6px; border: 1px solid var(--linea); border-radius: 9px;
  background: var(--papel); color: var(--tinta-2);
  font-size: 13px; cursor: pointer;
}
.segmentado button.activo { border-color: var(--verde); color: var(--verde);
                            font-weight: 600; }

.rol-fila { display: flex; gap: 7px; align-items: center; margin-bottom: 7px; }
.rol-fila input[type=text] { flex: 1; }
.rol-fila input[type=number] { width: 74px; }
h2.seccion { font-size: 10px; font-weight: 600; letter-spacing: 0.09em;
             text-transform: uppercase; color: var(--tinta-3);
             margin: 24px 0 9px 2px; }
</style>
</head>
<body>

<!-- ==========================================================================
     SECCIÓN I — Pantalla: SEMANA (la principal)
     ====================================================================== -->
<section id="p-semana">
  <div class="cabecera">
    <span class="lugar" id="lugar"></span>
    <button class="hoy oculto" id="btn-hoy" data-t="hoy" onclick="irAHoy()">Hoy</button>
  </div>

  <div class="semana-nav">
    <button id="btn-anterior" onclick="cambiarSemana(-1)"
            aria-label="Semana anterior">‹</button>
    <span class="rango" id="rango"></span>
    <button id="btn-siguiente" onclick="cambiarSemana(1)" aria-label="Semana siguiente">›</button>
  </div>

  <div class="dias" id="dias"></div>

  <div class="total">
    <div class="etiqueta" data-t="netoSemana">Neto de la semana</div>
    <div class="cantidad cifra" id="total-semana">$0</div>
    <div class="contra" id="contra-semana"></div>
  </div>

  <div class="metricas" id="metricas"></div>
  <div class="metricas extras oculto" id="metricas-extras"></div>
  <div class="dato-suelto oculto" id="mejor-dia"></div>
  <button class="mas" id="btn-mas" onclick="alternarEstadisticas()"></button>

  <p class="vacio" id="pista" data-t="pista">Toca un día para registrar el turno.</p>
</section>


<!-- ==========================================================================
     SECCIÓN J — Pantalla: TURNO (se abre al tocar un día)
     ====================================================================== -->
<section id="p-turno" class="oculto">
  <div class="barra-titulo">
    <span class="fecha" id="turno-fecha"></span>
    <button data-t="cerrar" onclick="cerrarTurno()">Cerrar</button>
  </div>

  <div class="tarjeta">
    <div class="fila campo">
      <div>
        <label class="etiqueta" data-t="entrada" for="f-entrada">Entrada</label>
        <input type="time" id="f-entrada">
        <div class="horas" id="horas-entrada"></div>
      </div>
      <div>
        <label class="etiqueta" data-t="salida" for="f-salida">Salida</label>
        <input type="time" id="f-salida">
        <div class="horas" id="horas-salida"></div>
      </div>
    </div>

    <div class="campo">
      <label class="etiqueta" data-t="ventasTurno" for="f-ventas">Ventas del turno</label>
      <input type="number" id="f-ventas" inputmode="decimal" step="0.01" min="0"
             placeholder="0.00">
    </div>

    <div class="fila campo">
      <div>
        <label class="etiqueta" data-t="propEfectivo" for="f-efectivo">Propina efectivo</label>
        <input type="number" id="f-efectivo" inputmode="decimal" step="0.01"
               min="0" placeholder="0.00">
      </div>
      <div>
        <label class="etiqueta" data-t="propTarjeta" for="f-tarjeta">Propina tarjeta</label>
        <input type="number" id="f-tarjeta" inputmode="decimal" step="0.01"
               min="0" placeholder="0.00">
      </div>
    </div>

    <div class="campo">
      <label class="etiqueta" data-t="ayudantes">Ayudantes del turno</label>
      <div class="chips" id="chips"></div>
    </div>

    <div class="campo">
      <label class="etiqueta" data-t="nota" for="f-nota">Nota</label>
      <input type="text" id="f-nota" data-ph="notaEjemplo"
             placeholder="Sección 3, evento privado…">
    </div>
  </div>

  <div class="tarjeta">
    <div class="recibo" id="recibo"></div>
  </div>

  <button class="principal" data-t="guardarTurno"
          onclick="guardarTurno()">Guardar turno</button>
  <button class="secundario riesgo oculto" id="btn-borrar" data-t="borrarTurno"
          onclick="borrarTurno()">Borrar este turno</button>
</section>


<!-- ==========================================================================
     SECCIÓN K — Pantalla: AJUSTES
     ====================================================================== -->
<section id="p-ajustes" class="oculto">
  <div class="barra-titulo"><span class="fecha" data-t="ajustes">Ajustes</span></div>

  <h2 class="seccion" data-t="trabajo">Trabajo</h2>
  <div class="tarjeta">
    <div class="campo">
      <label class="etiqueta" data-t="restaurante" for="a-nombre">Restaurante</label>
      <input type="text" id="a-nombre" onchange="guardarAjustes()">
    </div>
    <div class="campo">
      <label class="etiqueta" data-t="sueldoHora" for="a-tarifa">Sueldo por hora</label>
      <input type="number" id="a-tarifa" inputmode="decimal" step="0.01" min="0"
             onchange="guardarAjustes()" placeholder="0.00">
    </div>
  </div>

  <h2 class="seccion" data-t="idioma">Idioma</h2>
  <div class="tarjeta">
    <div class="segmentado" id="idiomas"></div>
  </div>

  <h2 class="seccion" data-t="apariencia">Apariencia</h2>
  <div class="tarjeta">
    <div class="segmentado" id="temas"></div>
  </div>

  <h2 class="seccion" data-t="ayudantesTipout">Ayudantes y tip-out</h2>
  <div class="tarjeta">
    <div id="roles"></div>
    <button class="chico" data-t="agregarRol" onclick="agregarRol()">+ Agregar rol</button>
    <p style="margin:13px 0 0; font-size:13px; color:var(--tinta-2)">
      <span data-t="sobreVentas">Porcentaje sobre las ventas del turno. Con todos:</span>
      <strong id="a-total">0%</strong></p>
  </div>

/** Devuelve el texto de una clave en el idioma activo. */
function t(clave) {
  const idioma = (datos.prefs && datos.prefs.idioma) || 'es';
  const tabla = TEXTOS[idioma] || TEXTOS.es;
  // Si a un idioma le falta una clave, cae al español en vez de mostrar la
  // clave cruda: es preferible una palabra en el idioma equivocado a ver
  // "mPorHora" en pantalla.
  return tabla[clave] !== undefined ? tabla[clave] : TEXTOS.es[clave];
}

/** Singular o plural, en el idioma activo. */
function plural(n, claveSingular, clavePlural) {
  return n === 1 ? t(claveSingular) : t(clavePlural);
}

/**
 * Mete valores en los huecos de un texto: rellenar('Van %1 de %2', 3, 7).
 *
 * `texto.replace('%s', x)` solo cambia el primer hueco, así que un mensaje con
 * dos datos salía a medias. Los huecos van numerados (%1, %2) y no en orden de
 * aparición a propósito: al traducir, el inglés a veces necesita los datos en
 * otro orden que el español, y con huecos numerados eso no obliga a tocar el
 * código.
 */
function rellenar(texto, ...valores) {
  return String(texto).replace(/%(\d+)/g,
    (hueco, n) => valores[n - 1] !== undefined ? valores[n - 1] : hueco);
}

/* ============================================================================
   SECCIÓN N — Guardar, cargar y formato
   ========================================================================== */

function guardar() { localStorage.setItem(CLAVE, JSON.stringify(datos)); }

/**
 * Identificador único para turnos y roles.
 *
 * Antes esto era `Date.now()`, o sea los milisegundos desde 1970. Funciona
 * mientras haya una sola persona tocando un teléfono: es imposible crear dos
 * turnos en el mismo milisegundo. Deja de funcionar en cuanto los datos de
 * varias personas viven en la misma base: dos meseros guardando su turno a la
 * salida del viernes pueden coincidir en el milisegundo, y entonces un turno
 * pisaría al otro.
 *
 * `randomUUID` devuelve un identificador aleatorio de 128 bits, del tipo que
 * usa Postgres para las llaves primarias. Cambiar esto ahora cuesta tres
 * líneas; cambiarlo cuando ya haya datos de diez personas cuesta una
 * migración.
 */
function nuevoId() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  // Respaldo para navegadores viejos: la hora más un pedazo al azar.
  return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
}

function cargar() {
  const g = localStorage.getItem(CLAVE);
  if (!g) return;
  try {
    // Mezclar con los valores por defecto, no reemplazar: así los datos
    // guardados con una versión vieja no llegan sin los campos nuevos.
    datos = { ...datos, ...JSON.parse(g) };
    // Red de seguridad: los datos guardados por una versión anterior no traen
    // `prefs`, y sin esta línea el primer toque al botón de estadísticas
    // reventaría contra un `undefined`.
    datos.prefs = { masEstadisticas: false, tema: 'auto', idioma: 'es',
                    ...(datos.prefs || {}) };
  } catch (e) {
    console.error('No se pudieron leer los datos:', e);
    alert(t('datosIlegibles'));
  }
}

/* El dinero se formatea siempre a la americana ($1,234.56) porque son dólares
   de un restaurante de Estados Unidos, se lea la app en el idioma que se lea.
   Lo que sí cambia con el idioma son las fechas. */
const USD = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
const USD0 = new Intl.NumberFormat('en-US',
  { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });

function locale() {
  return (datos.prefs && datos.prefs.idioma) === 'en' ? 'en-US' : 'es-US';
}

function $(n)  { return USD.format(Number(n) || 0); }
function $0(n) { return USD0.format(Number(n) || 0); }

function hoy() {
  const f = new Date();
  return `${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,'0')}`
       + `-${String(f.getDate()).padStart(2,'0')}`;
}

function partes(texto) {
  const [a, m, d] = String(texto).split('-').map(Number);
  return new Date(a, (m||1)-1, d||1);
}

function diaYMes(texto) {
  return partes(texto).toLocaleDateString(locale(),
    { day: 'numeric', month: 'short' });
}

/** "17:30" → "5:30 pm", "10:00" → "10 am". Corto para que quepa en un botón. */
function horaCorta(hhmm) {
  const [h, m] = String(hhmm).split(':').map(Number);
  const sufijo = h >= 12 ? 'pm' : 'am';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return m === 0 ? `${h12} ${sufijo}`
                 : `${h12}:${String(m).padStart(2, '0')} ${sufijo}`;
}

/* Ojo con el nombre de la variable: `t` ya es la función de traducción. Aquí
   se llama `texto1` justamente para no taparla dentro de esta función. */
function fechaLarga(texto) {
  const texto1 = partes(texto).toLocaleDateString(locale(),
    { weekday: 'long', day: 'numeric', month: 'long' });
  return texto1.charAt(0).toUpperCase() + texto1.slice(1);
}

/** Solo el nombre del día: "Viernes" / "Friday". */
function soloDia(texto) {
  const dia = partes(texto).toLocaleDateString(locale(), { weekday: 'long' });
  return dia.charAt(0).toUpperCase() + dia.slice(1);
}

/**
 * Aplica el tema elegido poniendo `data-tema` en la etiqueta <html>.
 *
 * "Automático" no es un tercer juego de colores: se traduce a claro u oscuro
 * preguntándole al sistema. Así el CSS solo tiene que conocer dos temas, que
 * es la mitad de los colores que mantener.
 */
function aplicarTema() {
  const elegido = datos.prefs.tema || 'auto';
  const oscuro = elegido === 'oscuro' || (elegido === 'auto' &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);

  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';

  // La barra de estado del iPhone se pinta con este color cuando la app está
  // instalada en la pantalla de inicio. Si no se actualiza, en tema claro
  // queda una franja verde oscuro arriba que no pega con nada.
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', oscuro ? '#0e0e0d' : '#faf9f7');
}

/* ----------------------------------------------------------------------------
   El globo de ayuda de cada dato.

   Se abre con el botón (i) y se cierra tocando en cualquier otro sitio. Antes
   la explicación estaba siempre visible debajo de cada cifra: informaba bien,
   pero convertía la pantalla en un muro de texto gris. Una ayuda que hay que
   pedir se lee cuando hace falta y no estorba el resto del tiempo.
   -------------------------------------------------------------------------- */

function mostrarNota(clave, boton) {
  const globo = document.getElementById('globo');
  globo.textContent = t(clave);
  globo.classList.remove('oculto');

  // Lo colocamos justo debajo del botón, pero sin dejar que se salga por los
  // lados de la pantalla: en las tarjetas de la derecha se saldría siempre.
  if (boton && boton.getBoundingClientRect) {
    const caja = boton.getBoundingClientRect();
    const ancho = 235;
    const margen = 14;
    const maximo = window.innerWidth - ancho - margen;
    let izquierda = caja.left + caja.width / 2 - ancho / 2;
    if (izquierda < margen) izquierda = margen;
    if (izquierda > maximo) izquierda = Math.max(margen, maximo);
    globo.style.left = izquierda + 'px';
    globo.style.top = (caja.bottom + 8) + 'px';
  }
}

function cerrarNota() {
  document.getElementById('globo').classList.add('oculto');
}

/** Abre el formulario de un día. Si ya hay turno, lo carga para editarlo. */
function abrirDia(fecha) {
  fechaAbierta = fecha;
  const existente = turnosDelDia(datos.turnos, fecha)[0];

  if (existente) {
    escribir(existente);
    rolesActivos = (existente.tipoutDetalle || []).map(d => d.rol);
  } else {
    escribir({});
    rolesActivos = rolesDelUltimoTurno();
  }

  pantalla = 'turno';
  pintar();
  window.scrollTo(0, 0);
}

function cerrarTurno() { irA('semana'); }

/**
 * Los ayudantes del último turno registrado, como punto de partida.
 * Casi siempre el equipo se repite, así que en el caso normal no hay que tocar
 * nada. La primera vez se marcan todos los roles configurados.
 */
function rolesDelUltimoTurno() {
  if (datos.turnos.length === 0) return datos.roles.map(r => r.nombre);
  // Ordenamos por fecha y tomamos el último. No hace falta desempatar por id
  // porque solo puede haber un turno por día.
  const ultimo = [...datos.turnos]
    .sort((a, b) => a.fecha.localeCompare(b.fecha)).pop();
  return (ultimo.tipoutDetalle || []).map(d => d.rol)
    .filter(n => datos.roles.some(r => r.nombre === n));
}


/* ============================================================================
   SECCIÓN P — Leer y escribir el formulario
   ----------------------------------------------------------------------------
   Una sola función arma el turno desde lo que hay en pantalla. La usan tanto
   el recibo en vivo como el botón de guardar, así que lo que ves mientras
   escribes es exactamente lo que se guarda.
   ========================================================================== */

function val(id) { return document.getElementById(id).value; }
function num(id) { return Number(val(id)) || 0; }

function leer() {
  const ventas = num('f-ventas');
  const rolesDelTurno = datos.roles.filter(r => rolesActivos.includes(r.nombre));
  const tipout = calcularTipOut(ventas, rolesDelTurno);
  const existente = turnosDelDia(datos.turnos, fechaAbierta)[0];

  return {
    id: existente ? existente.id : nuevoId(),
    fecha: fechaAbierta,
    entrada: val('f-entrada'),
    salida: val('f-salida'),
    ventas,
    efectivo: num('f-efectivo'),
    tarjeta: num('f-tarjeta'),
    // La tarifa se copia al turno. Si el restaurante te sube el sueldo en
    // octubre, tus turnos de agosto no pueden cambiar de valor solos.
    tarifaHora: Number(datos.trabajo.tarifaHora) || 0,
    tipOut: tipout.total,
    tipoutDetalle: tipout.detalle,
    nota: val('f-nota').trim()
  };
}

function escribir(t) {
  document.getElementById('f-entrada').value  = t.entrada  || '';
  document.getElementById('f-salida').value   = t.salida   || '';
  document.getElementById('f-ventas').value   = t.ventas   || '';
  document.getElementById('f-efectivo').value = t.efectivo || '';
  document.getElementById('f-tarjeta').value  = t.tarjeta  || '';
  document.getElementById('f-nota').value     = t.nota     || '';
}


/* ============================================================================

   ========================================================================== */

function guardarTurno() {
  const turno = leer();

  if (!turno.entrada || !turno.salida) {
    alert(t('faltaHora'));
    return;
  }
  if (turno.ventas === 0 && turno.efectivo === 0 && turno.tarjeta === 0) {
    alert(t('faltaPlata'));
    return;
  }

  const i = datos.turnos.findIndex(t => t.id === turno.id);
  if (i >= 0) datos.turnos[i] = turno; else datos.turnos.push(turno);

  guardar();
  // Al guardar, saltamos a la semana de ese turno: si corregiste un día de
  // otra semana, quieres verlo, no volver a donde estabas.
  lunes = lunesDeLaSemana(turno.fecha);
  irA('semana');
}

function borrarTurno() {
  const turno = turnosDelDia(datos.turnos, fechaAbierta)[0];
  if (!turno) return;
  if (!confirm(`${t('confirmBorrarTurno')} ${fechaLarga(turno.fecha)}?`)) return;
  datos.turnos = datos.turnos.filter(x => x.id !== turno.id);
  guardar();
  irA('semana');
}


/* ============================================================================
   SECCIÓN R — Ajustes
   ========================================================================== */

function guardarAjustes() {
  datos.trabajo.nombre     = val('a-nombre').trim() || t('miRestaurante');
  datos.trabajo.tarifaHora = num('a-tarifa');
  guardar();
  pintar();
}

function agregarRol() {
  datos.roles.push({ id: nuevoId(), nombre: t('nuevoRol'), porcentaje: 0 });
  guardar();
  pintar();
}

function cambiarRol(id, campo, valor) {
  const rol = datos.roles.find(r => r.id === id);
  if (!rol) return;
  const antes = rol.nombre;
  rol[campo] = campo === 'porcentaje' ? (Number(valor) || 0) : String(valor).trim();
  // Si le cambiaste el nombre a un rol que estaba marcado, que siga marcado.
  if (campo === 'nombre' && rolesActivos.includes(antes)) {
    rolesActivos = rolesActivos.map(n => n === antes ? rol.nombre : n);
  }
  guardar();
  pintar();
}

function borrarRol(id) {
  const rol = datos.roles.find(r => r.id === id);
  if (!rol) return;
  if (!confirm(t('confirmQuitarRol').replace('%s', rol.nombre))) return;
  datos.roles = datos.roles.filter(r => r.id !== id);
  rolesActivos = rolesActivos.filter(n => n !== rol.nombre);
  guardar();
  pintar();
}


/* ============================================================================
   SECCIÓN S — Respaldo
   ========================================================================== */

function exportar() {
  const enlace = document.createElement('a');
  enlace.href = URL.createObjectURL(
    new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' }));
  enlace.download = `tips-control-${hoy()}.json`;
  enlace.click();
  URL.revokeObjectURL(enlace.href);
}

/**
 * Mete un archivo de respaldo entre los datos que ya hay.
 *
 * Antes esta función hacía `datos = { ...datos, ...leido }`, que reemplazaba la
 * lista de turnos entera. Alguien que importara un respaldo de hace un mes para
 * recuperar un día perdía el mes completo, y el aviso solo le decía cuántos
 * turnos TRAÍA el archivo, nunca cuántos iba a destruir. Ahora se fusiona: el
 * archivo solo puede llenar días vacíos (ver `fusionarTurnos` en logica.js).
 *
 * Los ajustes sí se reemplazan por los del respaldo, y eso es seguro porque
 * cada turno guarda congelados su tarifa y su tip-out: cambiar los porcentajes
 * de hoy no mueve ni un centavo de lo ya registrado.
 */
function importar(evento) {
  const archivo = evento.target.files[0];
  if (!archivo) return;

  const lector = new FileReader();

  lector.onload = e => {
    let leido;
    try {
      leido = JSON.parse(e.target.result);
    } catch (err) {
      alert(t('archivoMalo'));
      return;
    }
    // Un JSON válido no es un respaldo válido. Cualquier archivo .json del
    // teléfono se abre sin error y no tiene nada que ver con esta app.
    if (!leido || typeof leido !== 'object' || !Array.isArray(leido.turnos)) {
      alert(t('archivoMalo'));
      return;
    }

    if (!confirm(rellenar(t('confirmImportar'), leido.turnos.length))) return;

    const fusion = fusionarTurnos(datos.turnos, leido.turnos);
    datos = { ...datos, ...leido, turnos: fusion.turnos };
    datos.prefs = { masEstadisticas: false, tema: 'auto', idioma: 'es',
                    ...(datos.prefs || {}) };
    guardar();
    irA('semana');

    // Decir exactamente qué pasó. Un "listo" deja a la persona sin saber si
    // faltó algo, y con dinero de por medio esa duda no se va sola.
    let resumen = rellenar(t('resumenImportar'), fusion.agregados, fusion.omitidos);
    if (fusion.invalidos > 0) {
      resumen += ' ' + rellenar(t('resumenIgnorados'), fusion.invalidos);
    }
    alert(resumen);
  };

  // Si el archivo no se puede ni leer (se quitó la memoria, permisos), hay que
  // decirlo: sin esto la app se queda callada y parece que no pasó nada.
  lector.onerror = () => alert(t('archivoMalo'));

  lector.readAsText(archivo);
  evento.target.value = '';
}

function borrarTodo() {
  if (!confirm(t('confirmBorrarTodo'))) return;
  if (!confirm(t('confirmBorrarTodo2'))) return;
  localStorage.removeItem(CLAVE);
  location.reload();
}


/* ============================================================================
   SECCIÓN T — Dibujar
   ========================================================================== */

/**
 * Traduce el texto que está escrito directamente en el HTML.
 *
 * Todo elemento con `data-t="clave"` recibe su texto, y todo elemento con
 * `data-ph="clave"` recibe su placeholder. Así no hay que ir elemento por
 * elemento desde el código: se marca en el HTML y esta función se encarga.
 */
function traducirEstaticos() {
  document.querySelectorAll('[data-t]').forEach(el => {
    el.textContent = t(el.dataset.t);
  });
  document.querySelectorAll('[data-ph]').forEach(el => {
    el.setAttribute('placeholder', t(el.dataset.ph));
  });
  const anterior = document.getElementById('btn-anterior');
  const siguiente = document.getElementById('btn-siguiente');
  if (anterior)  anterior.setAttribute('aria-label', t('semanaAnterior'));
  if (siguiente) siguiente.setAttribute('aria-label', t('semanaSiguiente'));
}

function pintar() {
  traducirEstaticos();
  document.getElementById('p-semana').classList.toggle('oculto', pantalla !== 'semana');
  document.getElementById('p-turno').classList.toggle('oculto', pantalla !== 'turno');
  document.getElementById('p-ajustes').classList.toggle('oculto', pantalla !== 'ajustes');

  // Con el formulario abierto se esconden las pestañas: estás en medio de una
  // tarea y saltar a otra sección solo sirve para perder lo que escribiste.
  document.getElementById('pestanas').classList.toggle('oculto', pantalla === 'turno');
  document.getElementById('tab-semana').classList.toggle('activa', pantalla === 'semana');
  document.getElementById('tab-ajustes').classList.toggle('activa', pantalla === 'ajustes');

  if (pantalla === 'semana')  pintarSemana();
  if (pantalla === 'turno')   pintarTurno();
  if (pantalla === 'ajustes') pintarAjustes();
}

/* --- La semana --- */
function pintarSemana() {
  const fechas = diasDeLaSemana(lunes);
  const deLaSemana = datos.turnos.filter(t => fechas.includes(t.fecha));
  const r = resumir(deLaSemana);

  document.getElementById('lugar').textContent = datos.trabajo.nombre;
  document.getElementById('rango').textContent =
    `${diaYMes(lunes)} – ${diaYMes(fechas[6])}`;

  const esSemanaActual = lunes === lunesDeLaSemana(hoy());
  document.getElementById('btn-hoy').classList.toggle('oculto', esSemanaActual);
  // No dejamos avanzar más allá de la semana en curso: registrar propinas del
  // futuro no significa nada, y un toque de más en la flecha te dejaría
  // mirando una semana vacía sin entender por qué.
  document.getElementById('btn-siguiente').disabled = esSemanaActual;

  // El día que más ganaste marca la altura máxima de las barras.
  const totales = fechas.map(f => {
    const turnoDelDia = turnosDelDia(datos.turnos, f)[0];
    return turnoDelDia ? calcularTurno(turnoDelDia).totalNeto : 0;
  });
  const tope = Math.max(...totales, 1);

  const caja = document.getElementById('dias');
  caja.innerHTML = '';
  fechas.forEach((fecha, i) => {
    const total = totales[i];
    const boton = document.createElement('button');
    boton.className = 'dia' + (total === 0 ? ' vacio' : '')
                    + (fecha === hoy() ? ' hoy' : '');
    boton.onclick = () => abrirDia(fecha);

    if (total > 0) {
      const barra = document.createElement('div');
      barra.className = 'barra';
      // Mínimo 12%: una barra de 2 píxeles no se ve y parece un error.
      barra.style.height = Math.max(12, total / tope * 68) + '%';
      boton.appendChild(barra);
    }

    const letra = document.createElement('span');
    letra.className = 'letra';
    letra.textContent = t('letrasDias')[i];

    const numero = document.createElement('span');
    numero.className = 'num';
    numero.textContent = partes(fecha).getDate();

    const monto = document.createElement('span');
    monto.className = 'monto';
    monto.textContent = total > 0 ? $0(total) : '';

    boton.append(letra, numero, monto);
    caja.appendChild(boton);
  });

  document.getElementById('total-semana').textContent = $(r.totalNeto);

  // Comparación con la semana anterior: un número solo no dice si fue buena
  // semana; comparado con el anterior, sí.
  const anteriores = diasDeLaSemana(sumarDias(lunes, -7));
  const rAnterior = resumir(datos.turnos.filter(x => anteriores.includes(x.fecha)));
  const hayAnterior = rAnterior.turnos > 0;

  const resumenTurnos = `${r.turnos} ${plural(r.turnos, 'turno', 'turnos')}`
                      + ` · ${r.horas} h`;
  const contra = document.getElementById('contra-semana');
  if (!hayAnterior) {
    contra.textContent = r.turnos === 0 ? t('sinTurnos') : resumenTurnos;
  } else {
    const dif = redondear(r.totalNeto - rAnterior.totalNeto);
    contra.innerHTML = resumenTurnos
      + ` · <span class="${dif >= 0 ? 'sube' : 'baja'}">`
      + `${dif >= 0 ? '+' : '−'}${$(Math.abs(dif))}</span> ${t('queSemanaPasada')}`;
  }

  /* --------------------------------------------------------------------------
     Cada tarjeta: etiqueta, cifra, diferencia contra la semana pasada y una
     explicación tenue de cómo se calcula.

     `sentido` decide de qué color va la diferencia:
       'mas'   → subir es bueno (verde) y bajar es malo (rojo)
       'plano' → gris, sin juicio

     Horas y tip-out van en 'plano' a propósito. Trabajar más horas no es
     mejor ni peor: depende de si querías el turno. Y el tip-out sube cuando
     vendes más, así que pintarlo de rojo sería regañarte por una buena noche.
     Un color que significa lo que no es hace más daño que no poner color.
     -------------------------------------------------------------------------- */
  const metrica = (claveEtiqueta, valor, actual, previo, formato,
                   sentido, claveNota) => {
    let delta = '';
    if (hayAnterior) {
      const dif = redondear(actual - previo);
      if (dif !== 0) {
        const clase = sentido === 'plano' ? 'plano' : (dif > 0 ? 'sube' : 'baja');
        delta = `<span class="delta ${clase}">${dif > 0 ? '+' : '−'}`
              + `${formato(Math.abs(dif))}</span>`;
      }
    }
    return `<div class="metrica">`
         + `<div class="cabeza"><span class="etiqueta">${t(claveEtiqueta)}</span>`
         + `<button class="info" onclick="mostrarNota('${claveNota}', this)"`
         + ` aria-label="${t(claveEtiqueta)}">i</button></div>`
         + `<div class="valor">${valor}</div>${delta}</div>`;
  };

  const horas = n => n + ' h';
  const pct   = n => n + '%';

  // Las cuatro de siempre. Horas porque hay que apuntarlas en la planilla del
  // restaurante; efectivo y tarjeta separados porque no son el mismo dinero:
  // la tarjeta llega en el cheque, el efectivo va al bolsillo esa noche.
  document.getElementById('metricas').innerHTML =
      metrica('mHoras',    r.horas + ' h',      r.horas,        rAnterior.horas,        horas, 'plano', 'nHoras')
    + metrica('mPorHora',  $(r.totalPorHora),   r.totalPorHora, rAnterior.totalPorHora, $,     'mas',   'nPorHora')
    + metrica('mEfectivo', $0(r.efectivo),      r.efectivo,     rAnterior.efectivo,     $0,    'mas',   'nEfectivo')
    + metrica('mTarjeta',  $0(r.tarjeta),       r.tarjeta,      rAnterior.tarjeta,      $0,    'mas',   'nTarjeta');

  // Las demás viven detrás del botón: son útiles de vez en cuando, y una
  // pantalla con doce números no se lee, se sobrevuela.
  const abierto = !!datos.prefs.masEstadisticas;
  document.getElementById('metricas-extras').innerHTML =
      metrica('mPropinas', $0(r.propinas),      r.propinas,        rAnterior.propinas,        $0,  'mas',   'nPropinas')
    + metrica('mTipOut',   $0(r.tipOut),        r.tipOut,          rAnterior.tipOut,          $0,  'plano', 'nTipOut')
    + metrica('mVentas',   $0(r.ventas),        r.ventas,          rAnterior.ventas,          $0,  'mas',   'nVentas')
    + metrica('mPropVtas', r.porcentajeVentas + '%', r.porcentajeVentas, rAnterior.porcentajeVentas, pct, 'mas', 'nPropVtas')
    + metrica('mSueldo',   $0(r.sueldoBase),    r.sueldoBase,      rAnterior.sueldoBase,      $0,  'plano', 'nSueldo')
    + metrica('mPorTurno', $0(r.promedioPorTurno), r.promedioPorTurno, rAnterior.promedioPorTurno, $0, 'mas', 'nPorTurno');
  document.getElementById('metricas-extras').classList.toggle('oculto', !abierto);

  const mejor = mejorTurno(deLaSemana);
  const lineaMejor = document.getElementById('mejor-dia');
  lineaMejor.classList.toggle('oculto', !abierto || !mejor);
  if (mejor && abierto) {
    const cm = calcularTurno(mejor);
    lineaMejor.textContent = `${t('mejorDia')}: ${soloDia(mejor.fecha)} `
      + `${t('conEn')} ${$(cm.totalNeto)} ${t('enHoras')} ${cm.horas} h.`;
  }

  document.getElementById('btn-mas').textContent =
    abierto ? t('mostrarMenos') : t('mostrarMas');

  document.getElementById('pista').classList.toggle('oculto', datos.turnos.length > 0);
}

/* --- El formulario --- */
function pintarTurno() {
  document.getElementById('turno-fecha').textContent = fechaLarga(fechaAbierta);
  const existe = turnosDelDia(datos.turnos, fechaAbierta).length > 0;
  document.getElementById('btn-borrar').classList.toggle('oculto', !existe);

  pintarAtajosHora('entrada');
  pintarAtajosHora('salida');

  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  if (datos.roles.length === 0) {
    chips.innerHTML = '<span style="font-size:13px;color:var(--tinta-3)">'
                    + t('rolesEnAjustes') + '</span>';
  }
  datos.roles.forEach(rol => {
    const activo = rolesActivos.includes(rol.nombre);
    const chip = document.createElement('div');
    chip.className = 'chip' + (activo ? ' activo' : '');
    // textContent y no innerHTML: si un rol tuviera un signo raro en el
    // nombre, innerHTML intentaría interpretarlo como HTML.
    chip.textContent = rol.nombre;
    const pct = document.createElement('small');
    pct.textContent = rol.porcentaje + '%';
    chip.appendChild(pct);
    chip.onclick = () => {
      rolesActivos = activo ? rolesActivos.filter(n => n !== rol.nombre)
                            : [...rolesActivos, rol.nombre];
      pintar();
    };
    chips.appendChild(chip);
  });

  pintarRecibo();
}

/**
 * Los botones de hora rápida debajo de cada campo.
 *
 * Deliberadamente NO se rellena la hora sola al abrir el día. Con los
 * ayudantes sí se hace, porque un ayudante de más se ve marcado en pantalla y
 * salta a la vista. Una hora equivocada, en cambio, no se nota: el turno se
 * guarda igual, con la duración mal, y arrastra el error a las horas de la
 * semana y a todos los cálculos por hora. Un toque consciente es más barato
 * que un dato que miente.
 */
function pintarAtajosHora(campo) {
  const caja = document.getElementById('horas-' + campo);
  const propias = horasFrecuentes(datos.turnos, campo, 4);
  const opciones = propias.length > 0 ? propias : HORAS_POR_DEFECTO[campo];
  const actual = val('f-' + campo);

  caja.innerHTML = '';
  opciones.forEach(hora => {
    const boton = document.createElement('button');
    boton.type = 'button';
    boton.className = hora === actual ? 'puesta' : '';
    boton.textContent = horaCorta(hora);
    boton.onclick = () => {
      document.getElementById('f-' + campo).value = hora;
      pintar();
    };
    caja.appendChild(boton);
  });
}

function pintarRecibo() {
  const turno = leer();
  const c = calcularTurno(turno);
  // `fila` recibe la clase de la fila y la del valor por separado: la última
  // línea del recibo lleva `final` (la raya y el número grande) y el tip-out
  // lleva `resta` solo en la cifra.
  const fila = (etiqueta, valor, claseValor = '', claseFila = '') =>
    `<div class="${claseFila}"><span>${etiqueta}</span>`
  + `<span class="${claseValor}">${valor}</span></div>`;

  const cuantos = turno.tipoutDetalle.length;
  let html = fila(t('mPropinas'), $(c.propinas));
  if (c.tipOut > 0) {
    html += fila(`${t('mTipOut')} · ${cuantos} `
               + `${plural(cuantos, 'ayudante', 'ayudantesPl')}`,
                 '− ' + $(c.tipOut), 'resta');
  }
  if (c.sueldoBase > 0) {
    html += fila(`${t('sueldoRecibo')} · ${c.horas} h`, '+ ' + $(c.sueldoBase));
  }
  if (turno.ventas > 0) {
    html += fila(t('propinaSobreVentas'), c.porcentajeVentas + '%');
  }
  html += fila(`${t('teLlevas')}${c.horas > 0 ? ` · ${$(c.totalPorHora)}/h` : ''}`,
               $(c.totalNeto), '', 'final');

  document.getElementById('recibo').innerHTML = html;
}

/* --- Ajustes --- */
function pintarAjustes() {
  document.getElementById('a-nombre').value = datos.trabajo.nombre;
  document.getElementById('a-tarifa').value = datos.trabajo.tarifaHora || '';

  const idiomas = document.getElementById('idiomas');
  idiomas.innerHTML = '';
  IDIOMAS.forEach(idioma => {
    const boton = document.createElement('button');
    boton.textContent = idioma.nombre;
    boton.className = (datos.prefs.idioma || 'es') === idioma.id ? 'activo' : '';
    boton.onclick = () => cambiarIdioma(idioma.id);
    idiomas.appendChild(boton);
  });

  const temas = document.getElementById('temas');
  temas.innerHTML = '';
  TEMAS.forEach(tema => {
    const boton = document.createElement('button');
    boton.textContent = t(tema.clave);
    boton.className = (datos.prefs.tema || 'auto') === tema.id ? 'activo' : '';
    boton.onclick = () => cambiarTema(tema.id);
    temas.appendChild(boton);
  });

  const lista = document.getElementById('roles');
  lista.innerHTML = '';
  datos.roles.forEach(rol => {
    const fila = document.createElement('div');
    fila.className = 'rol-fila';

    const nombre = document.createElement('input');
    nombre.type = 'text';
    nombre.value = rol.nombre;
    nombre.onchange = e => cambiarRol(rol.id, 'nombre', e.target.value);

    const pct = document.createElement('input');
    pct.type = 'number';
    pct.inputMode = 'decimal';
    pct.step = '0.1';
    pct.min = '0';
    pct.value = rol.porcentaje;
    pct.onchange = e => cambiarRol(rol.id, 'porcentaje', e.target.value);

    const quitar = document.createElement('button');
    quitar.className = 'chico';
    quitar.style.color = 'var(--rojo)';
    quitar.textContent = '✕';
    quitar.onclick = () => borrarRol(rol.id);

    fila.append(nombre, pct, quitar);
    lista.appendChild(fila);
  });

  const suma = datos.roles.reduce((s, r) => s + (Number(r.porcentaje) || 0), 0);
  document.getElementById('a-total').textContent = redondear(suma) + '%';
}


/* ============================================================================
   SECCIÓN U — Arranque
   ========================================================================== */

// Al escribir se actualiza solo el recibo, no la pantalla entera: si
// redibujáramos todo, el campo perdería el foco a media palabra y el teclado
// se cerraría solo.
['f-ventas','f-efectivo','f-tarjeta','f-nota']
  .forEach(id => document.getElementById(id)
    .addEventListener('input', pintarRecibo));

// Los campos de hora sí repintan también sus atajos, para que el botón
// correspondiente quede marcado si eliges esa hora a mano. No hay riesgo de
// perder el foco: un selector de hora no es un campo de texto.
['entrada','salida'].forEach(campo =>
  document.getElementById('f-' + campo).addEventListener('input', () => {
    pintarAtajosHora(campo);
    pintarRecibo();
  }));

// Cerrar el globo al tocar en cualquier otro sitio.
//
// `true` al final activa la fase de captura: este manejador corre ANTES que el
// onclick del botón (i). Así, un toque en otro botón de información cierra el
// globo viejo y enseguida el botón abre el nuevo, en ese orden. Sin la
// captura, el orden se invierte y el globo se cerraría justo después de
// abrirse — que es como se ve un botón que "no funciona".
document.addEventListener('click', evento => {
  const destino = evento.target;
  const esBotonInfo = destino && destino.classList
                   && destino.classList.contains('info');
  if (!esBotonInfo) cerrarNota();
}, true);

// Al desplazar la pantalla el globo se quedaría flotando en el aire, porque su
// posición está fijada a la ventana y no al botón.
window.addEventListener('scroll', cerrarNota, { passive: true });

cargar();
aplicarTema();
document.documentElement.lang = (datos.prefs.idioma || 'es');
lunes = lunesDeLaSemana(hoy());
pintar();

// Si el tema está en Automático y cambias el del teléfono (o entra el modo
// nocturno solo al anochecer), la app se entera y cambia en el momento, sin
// tener que cerrarla y volver a abrirla.
window.matchMedia('(prefers-color-scheme: dark)')
  .addEventListener('change', () => {
    if ((datos.prefs.tema || 'auto') === 'auto') aplicarTema();
  });

// El service worker solo funciona con la app publicada, no al abrir el archivo
// con doble clic. El `catch` vacío es a propósito: en el Mac falla siempre.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
